<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Study Sheet of History</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 600px;
    margin-top: 50px;
    text-align: center;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 15px;
}

textarea {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    border: none;
    resize: none;
    height: 100px;
    font-size: 14px;
}

button {
    margin-top: 15px;
    padding: 12px;
    width: 100%;
    background: #3b82f6;
    border: none;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #2563eb;
}

.stats {
    margin-top: 15px;
    font-size: 14px;
}

#timer {
    font-size: 32px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="quiz">
    <h2 id="question"></h2>
    <textarea id="answer" placeholder="Escriu la teva resposta..."></textarea>
    <button onclick="next()">Responder</button>

    <div class="stats">
        <p id="progress"></p>
        <p id="accuracy"></p>
    </div>
</div>

<div class="card" id="result" style="display:none;">
    <h2>Test completat</h2>
    <p id="finalStats"></p>

    <h3>Temps per estudiar</h3>
    <div id="timer">7:00</div>
</div>

</div>

<script>
const questions = [
    {q: "Per a què serveix la història?", a: ["passat"]},
    {q: "Què és una font històrica?", a: ["informacio","font"]},
    {q: "Etapes de l’Edat Mitjana?", a: ["alta","baixa"]},
    {q: "Tres civilitzacions mediterrànies?", a: ["bizanti","islam","crist"]},
    {q: "Per què va caure l’Imperi Romà?", a: ["invasions","crisi"]},
    {q: "Qui era Justinià?", a: ["emperador"]},
    {q: "Què és el Codi de Justinià?", a: ["lleis"]},
    {q: "Quan va caure Bizanci?", a: ["1453"]},
    {q: "Defineix patriarca", a: ["esglesia"]},
    {q: "Què és un latifundi?", a: ["terra"]}
];

let index = 0;
let correct = 0;
let wrong = 0;

function loadQuestion() {
    document.getElementById("question").innerText = questions[index].q;
    document.getElementById("answer").value = "";
    document.getElementById("answer").focus();
    updateStats();
}

function next() {
    let user = document.getElementById("answer").value.toLowerCase();

    if(user.trim() === "") {
        alert("Has de respondre!");
        return;
    }

    let valid = questions[index].a.some(ans => user.includes(ans));

    if(valid) correct++;
    else wrong++;

    index++;

    if(index >= questions.length) {
        finish();
        return;
    }

    loadQuestion();
}

function updateStats() {
    let total = correct + wrong;
    let acc = total === 0 ? 0 : ((correct/total)*100).toFixed(1);

    document.getElementById("progress").innerText =
        "Pregunta: " + (index+1) + " / " + questions.length;

    document.getElementById("accuracy").innerText =
        "Encerts: " + correct + " | Errors: " + wrong + " | % encert: " + acc;
}

function finish() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    let total = correct + wrong;
    let acc = ((correct/total)*100).toFixed(1);

    document.getElementById("finalStats").innerText =
        "Encerts: " + correct +
        " | Errors: " + wrong +
        " | Nota: " + (acc/10).toFixed(2);

    startTimer(420);
}

function startTimer(seconds) {
    let timer = document.getElementById("timer");

    let interval = setInterval(() => {
        let min = Math.floor(seconds/60);
        let sec = seconds % 60;

        timer.innerText = min + ":" + (sec < 10 ? "0"+sec : sec);

        seconds--;

        if(seconds < 0) {
            clearInterval(interval);
            restart();
        }
    }, 1000);
}

function restart() {
    index = 0;
    correct = 0;
    wrong = 0;

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    loadQuestion();
}

// ENTER para responder
document.getElementById("answer").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        next();
    }
});

// bloquear salida
window.onbeforeunload = () => "No pots sortir fins acabar";

loadQuestion();
</script>

</body>
</html>
